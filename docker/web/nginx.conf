# Host-facing front door. `php`, `mailer` and `database` sit on the internal
# (no-internet) network, and Docker can't publish ports from internal-only
# containers, so this trusted nginx forwards fixed ports to them. It is not a
# general proxy: every upstream is hard-coded.

worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 64m;

    # Resolve upstreams per request so nginx starts even if a service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # App: http://127.0.0.1:8000 (Host header passed through for multi-domain routing)
    server {
        listen 8000;
        location / {
            set $app http://php:8000;
            proxy_pass $app;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    # Mailpit UI: http://127.0.0.1:8025
    server {
        listen 8025;
        location / {
            set $mailpit http://mailer:8025;
            proxy_pass $mailpit;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}

# Postgres for host GUI tools: 127.0.0.1:30000
stream {
    server {
        listen 5432;
        proxy_pass database:5432;
    }
}
