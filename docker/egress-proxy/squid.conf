# Egress allowlist for dependency installs (composer, npm, audits).
#
# Only HTTPS CONNECT tunnels to these hosts are allowed. If an install fails,
# `make egress-logs` shows TCP_DENIED lines naming the blocked host; add it
# here only if you trust it, then `make build`.
acl registries dstdomain packagist.org repo.packagist.org
acl registries dstdomain github.com api.github.com codeload.github.com
acl registries dstdomain objects.githubusercontent.com raw.githubusercontent.com
acl registries dstdomain registry.npmjs.org

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow registries
http_access deny all

http_port 3128

# No caching, no identifying headers, no pid file, fast shutdown.
cache deny all
via off
forwarded_for delete
pid_filename none
coredump_dir /tmp
shutdown_lifetime 1 seconds

access_log stdio:/var/log/squid/access.log
logfile_rotate 0
