framework:
    html_sanitizer:
        sanitizers:
            app.rich_text:
                allow_safe_elements: true
                allowed_link_schemes: ['https', 'http', 'mailto']
                allowed_media_schemes: ['https', 'http']
                allow_relative_links: true
                allow_relative_medias: true
                # Default is 20000 characters, and longer input is truncated
                # silently. Long-form posts can exceed that.
                max_input_length: 500000
